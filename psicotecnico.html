 const q=QS[qi];sel=null;
 const top=`<div class="glass top"><b>🧠</b><div class="prog"><i style="width:${qi/QS.length*100}%"></i></div><span class="tm" id="tm"></span></div>`;
 if(q.memo&&!q._memoDone){let n=8;app.innerHTML=flags()+top+`<div class="glass card" style="text-align:center"><span class="muted">${X.q} ${qi+1} ${X.of} ${QS.length}</span><h3 style="margin-top:12px">🧠 ${MEMO_T[lang]}</h3><div style="font-size:24px;font-weight:700;margin:20px 0;padding:20px;border-radius:16px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.35)">${q.memo[lang]}</div><p class="muted">${MEMO_S[lang]} <b id="mm">${n}</b>s</p></div>`;
   timer=setInterval(()=>{n--;const e=document.getElementById('mm');if(e)e.textContent=n;if(n<=0){clearInterval(timer);q._memoDone=true;R()}},1000);return}
 let body='';
 if(q.type==='tap'){if(!q._st){const g=q.gen();q._st={cells:g.cells,order:!!g.order,done:new Set(),wrong:0,next:1}}const st=q._st;
   body=`<p class="muted" style="margin:10px 0 12px;font-size:14px">${TAPL[lang].hint}</p><div style="display:grid;grid-template-columns:repeat(${st.order?5:6},1fr);gap:8px">${st.cells.map((c,i)=>c.empty?'<span></span>':`<button class="glass cell" id="tp${i}" onclick="hit(${i})">${c.h}</button>`).join('')}</div>`}
 else{const ord=shuffle([0,1,2,3]);const big=q.blk==='vis'&&q.o[lang][0].length<=2;body=ord.map((oi,k)=>`<button class="glass opt" data-i="${oi}" onclick="pick(${oi})"><span class="letter">${'ABCD'[k]}</span><span style="${big?'font-size:32px':''}">${q.o[lang][oi]}</span></button>`).join('')}
 app.innerHTML=flags()+top+`<div class="glass card"><span class="muted">${X.q} ${qi+1} ${X.of} ${QS.length}</span><h3 style="font-size:21px;margin:10px 0 6px">${q.t[lang]}</h3>${body}
  <div style="text-align:right;margin-top:16px"><button class="btn" id="nx" ${q.type==='tap'?'':'disabled style="opacity:.5"'} onclick="ans()">${q.type==='tap'?TAPL[lang].done:X.next} →</button></div></div>`;
 left=q.time;tick();timer=setInterval(tick,1000);
}
function tick(){const e=document.getElementById('tm');if(e)e.textContent='⏱ '+left+'s';if(left--<=0){clearInterval(timer);ans(true)}}
function pick(i){sel=i;document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));const n=document.getElementById('nx');n.disabled=false;n.style.opacity=1}
function hit(i){const q=QS[qi],st=q._st,c=st.cells[i],el=document.getElementById('tp'+i);if(!c||st.done.has(i))return;const ok=st.order?c.n===st.next:c.tg;
 if(ok){st.done.add(i);if(st.order)st.next++;el.style.background='rgba(34,197,94,.35)';el.style.borderColor='#22c55e'}else{st.wrong++;el.style.background='rgba(239,68,68,.45)';setTimeout(()=>{if(!st.done.has(i))el.style.background=''},350)}
 if(st.done.size>=st.cells.filter(x=>x.tg).length)setTimeout(()=>{if(QS[qi]===q)ans()},350)}
function ans(timeout){const q=QS[qi];if(!q)return;clearInterval(timer);
 if(q.type==='tap'){const st=q._st,T=st.cells.filter(x=>x.tg).length,h=st.done.size;res.push({blk:'tap',frac:Math.max(0,Math.min(1,(h-st.wrong*.5)/T))})}
 else res.push({blk:q.blk,ok:!timeout&&sel===q.ans});
 qi++;R()}
R();
</script></body></html>
