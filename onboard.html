.letter{width:32px;height:32px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(47,134,224,.3);font-weight:700}

 {ico:'🧪',t:{pt:'Produtos químicos e fichas de segurança',en:'Chemicals and safety data sheets',es:'Productos químicos y hojas de seguridad'},
  pts:{pt:['Aqui usamos resina, gel coat, catalisador, acelerador, tintas e solventes. Muitos são inflamáveis e fazem mal se respirados ou em contato com a pele.','Todo produto tem um rótulo com pictogramas de perigo e uma Ficha de Segurança (SDS). Pergunte ao líder onde ficam as fichas da sua área.','O estireno, que sai da resina e do gel coat, é o principal vapor da fibra de vidro. Use ventilação e o respirador certo.','Nunca misture o catalisador direto com o acelerador. Nunca use produto de recipiente sem rótulo.','Panos sujos de resina ou solvente vão em lixeira de metal com tampa, porque podem pegar fogo sozinhos.'],
   en:['We use resin, gel coat, catalyst, accelerator, paints and solvents here. Many are flammable and harmful if breathed in or in contact with skin.','Every product has a label with hazard pictograms and a Safety Data Sheet (SDS). Ask your lead where the sheets for your area are kept.','Styrene, which comes off resin and gel coat, is the main vapor in fiberglass work. Use ventilation and the right respirator.','Never mix catalyst directly with accelerator. Never use a product from an unlabeled container.','Rags with resin or solvent go in a metal can with a lid, because they can catch fire on their own.'],
   es:['Aquí usamos resina, gel coat, catalizador, acelerador, pinturas y solventes. Muchos son inflamables y hacen daño si se respiran o tocan la piel.','Cada producto tiene una etiqueta con pictogramas de peligro y una Hoja de Seguridad (SDS). Pregunte a su líder dónde están las hojas de su área.','El estireno, que sale de la resina y del gel coat, es el principal vapor en la fibra de vidrio. Use ventilación y el respirador correcto.','Nunca mezcle el catalizador directo con el acelerador. Nunca use un producto de un recipiente sin etiqueta.','Los trapos con resina o solvente van en un bote de metal con tapa, porque pueden prenderse solos.']},
  q:[OQ({pt:'Onde você encontra os perigos e os cuidados de um produto químico?',en:'Where do you find the hazards and precautions for a chemical?',es:'¿Dónde encuentra los peligros y cuidados de un producto químico?'},
      {pt:['No rótulo e na Ficha de Segurança (SDS)','Sentindo o cheiro','Na nota fiscal'],en:['On the label and the Safety Data Sheet (SDS)','By smelling it','On the invoice'],es:['En la etiqueta y la Hoja de Seguridad (SDS)','Oliéndolo','En la factura']},0,
      {pt:'O rótulo e a SDS mostram os perigos, os EPIs e o que fazer em emergência.',en:'The label and the SDS show the hazards, the PPE and what to do in an emergency.',es:'La etiqueta y la SDS muestran los peligros, el EPP y qué hacer en una emergencia.'}),
     OQ({pt:'O que fazer com um pano sujo de resina ou solvente?',en:'What do you do with a rag soaked in resin or solvent?',es:'¿Qué hace con un trapo sucio de resina o solvente?'},
      {pt:['Jogar no lixo comum','Colocar na lixeira de metal com tampa','Deixar secando na bancada'],en:['Throw it in the regular trash','Put it in the metal can with a lid','Leave it drying on the bench'],es:['Tirarlo a la basura común','Ponerlo en el bote de metal con tapa','Dejarlo secando en la mesa']},1,
      {pt:'Esses panos podem esquentar e pegar fogo sozinhos. A lixeira de metal com tampa evita incêndio.',en:'Those rags can heat up and catch fire on their own. The metal can with a lid prevents fires.',es:'Esos trapos pueden calentarse y prenderse solos. El bote de metal con tapa evita incendios.'})]},
 {ico:'🦺',t:{pt:'EPIs: equipamentos de proteção',en:'PPE: personal protective equipment',es:'EPP: equipo de protección personal'},
  pts:{pt:['Na fábrica, use sempre óculos de segurança e calçado de segurança. O seu líder mostra os EPIs extras de cada área.','Laminação, resina e gel coat: luvas nitrílicas, manga longa ou avental, e respirador para vapores orgânicos.','Lixamento e corte de fibra: respirador para poeira (N95 ou superior), protetor auricular e roupa que cubra a pele.','Vista o EPI antes de entrar na área, tire depois de sair e guarde limpo. EPI rasgado, riscado ou vencido: troque antes de continuar.'],
   en:['On the shop floor, always wear safety glasses and safety shoes. Your lead will show you the extra PPE for each area.','Lamination, resin and gel coat: nitrile gloves, long sleeves or an apron, and an organic vapor respirator.','Sanding and cutting fiberglass: a dust respirator (N95 or better), hearing protection and clothing that covers your skin.','Put PPE on before entering the area, take it off after leaving and store it clean. Torn, scratched or expired PPE: replace it before continuing.'],
   es:['En la planta, use siempre lentes y calzado de seguridad. Su líder le mostrará el EPP extra de cada área.','Laminación, resina y gel coat: guantes de nitrilo, manga larga o delantal, y respirador para vapores orgánicos.','Lijado y corte de fibra: respirador para polvo (N95 o superior), protector auditivo y ropa que cubra la piel.','Póngase el EPP antes de entrar al área, quíteselo al salir y guárdelo limpio. EPP roto, rayado o vencido: cámbielo antes de continuar.']},
  q:[OQ({pt:'Qual luva usar para mexer com resina e catalisador?',en:'Which glove do you use to handle resin and catalyst?',es:'¿Qué guante usar para manipular resina y catalizador?'},
      {pt:['Luva de algodão','Luva nitrílica','Sem luva, é mais rápido'],en:['Cotton glove','Nitrile glove','No glove, it is faster'],es:['Guante de algodón','Guante de nitrilo','Sin guante, es más rápido']},1,
      {pt:'A luva nitrílica resiste aos químicos. Algodão absorve a resina e deixa ela encostar na pele.',en:'Nitrile gloves resist chemicals. Cotton soaks up resin and lets it touch your skin.',es:'El guante de nitrilo resiste los químicos. El algodón absorbe la resina y la deja tocar la piel.'}),
     OQ({pt:'Seus óculos de segurança estão riscados e a luva furou. O que fazer?',en:'Your safety glasses are scratched and your glove has a hole. What do you do?',es:'Sus lentes están rayados y el guante se rompió. ¿Qué hace?'},
      {pt:['Continuar até o fim do turno','Parar e trocar o EPI antes de continuar','Tirar os óculos para enxergar melhor'],en:['Keep going until the end of the shift','Stop and replace the PPE before continuing','Take off the glasses to see better'],es:['Seguir hasta el final del turno','Parar y cambiar el EPP antes de continuar','Quitarse los lentes para ver mejor']},1,
      {pt:'EPI danificado não protege. Peça um novo ao líder ou ao almoxarifado.',en:'Damaged PPE does not protect you. Ask your lead or the warehouse for a new one.',es:'El EPP dañado no protege. Pida uno nuevo al líder o al almacén.'})]},
 {ico:'😷',t:{pt:'Respirador e poeira',en:'Respirator and dust',es:'Respirador y polvo'},
  pts:{pt:['Existem dois tipos principais: filtro para poeira (lixamento e corte) e cartucho para vapores orgânicos (resina, gel coat e tinta).','Antes de usar o respirador, a empresa faz o treinamento e o teste de vedação no seu rosto. Barba atrapalha a vedação.','Toda vez que colocar, faça a checagem de vedação: tampe a saída e respire. A máscara deve encostar no rosto, sem vazar.','Se sentir cheiro de estireno com o respirador, ou se ficar difícil respirar, saia da área e troque o filtro ou o cartucho.'],
   en:['There are two main types: dust filters (sanding and cutting) and organic vapor cartridges (resin, gel coat and paint).','Before you use a respirator, the company gives you training and a fit test on your face. A beard prevents a good seal.','Every time you put it on, do a seal check: block the outlet and breathe. The mask should pull against your face without leaking.','If you smell styrene with the respirator on, or breathing gets hard, leave the area and change the filter or cartridge.'],
   es:['Hay dos tipos principales: filtro para polvo (lijado y corte) y cartucho para vapores orgánicos (resina, gel coat y pintura).','Antes de usar el respirador, la empresa le da el entrenamiento y la prueba de ajuste en su cara. La barba impide un buen sello.','Cada vez que se lo ponga, revise el sello: tape la salida y respire. La máscara debe pegarse a la cara sin fugas.','Si huele estireno con el respirador puesto, o le cuesta respirar, salga del área y cambie el filtro o el cartucho.']},
  q:[OQ({pt:'Para aplicar gel coat com pistola, qual respirador usar?',en:'To spray gel coat with a gun, which respirator do you use?',es:'Para aplicar gel coat con pistola, ¿qué respirador usar?'},
      {pt:['Máscara de pano','Respirador com cartucho para vapores orgânicos','Nenhum, se a porta estiver aberta'],en:['A cloth mask','A respirator with organic vapor cartridges','None, if the door is open'],es:['Mascarilla de tela','Respirador con cartucho para vapores orgánicos','Ninguno, si la puerta está abierta']},1,
      {pt:'O vapor do gel coat (estireno) só é barrado pelo cartucho para vapores orgânicos.',en:'Gel coat vapor (styrene) is only stopped by an organic vapor cartridge.',es:'El vapor del gel coat (estireno) solo lo detiene el cartucho para vapores orgánicos.'}),
     OQ({pt:'Você está de respirador e começa a sentir cheiro de estireno. O que isso indica?',en:'You are wearing a respirator and start to smell styrene. What does that mean?',es:'Tiene puesto el respirador y empieza a oler estireno. ¿Qué indica?'},
      {pt:['Que está tudo normal','Que o cartucho está vencido ou a vedação falhou: saia e troque','Que precisa apertar menos'],en:['That everything is normal','That the cartridge is spent or the seal failed: leave and replace it','That it needs to be looser'],es:['Que todo está normal','Que el cartucho está vencido o el sello falló: salga y cámbielo','Que hay que aflojarlo']},1,
      {pt:'Sentir o cheiro com o respirador é sinal de que ele não está protegendo.',en:'Smelling it with the respirator on is a sign it is not protecting you.',es:'Oler con el respirador puesto es señal de que no lo está protegiendo.'})]},
 {ico:'🎧',t:{pt:'Ruído e proteção auditiva',en:'Noise and hearing protection',es:'Ruido y protección auditiva'},
  pts:{pt:['Lixadeiras, serras, ar comprimido e algumas máquinas fazem barulho alto. A perda de audição é lenta, não dói e não tem volta.','Use protetor auricular sempre que houver placa de uso obrigatório ou ruído alto.','Protetor de espuma: enrole bem fino, coloque no ouvido puxando a orelha para cima e segure até expandir.','Protetor tipo concha (abafador): as conchas devem cobrir toda a orelha, sem cabelo, boné ou óculos atrapalhando a vedação.'],
   en:['Sanders, saws, compressed air and some machines are loud. Hearing loss is slow, painless and permanent.','Wear hearing protection wherever there is a mandatory sign or loud noise.','Foam earplugs: roll them thin, pull your ear up, insert, and hold until they expand.','Earmuffs: the cups must cover the whole ear, with no hair, cap or glasses breaking the seal.'],
   es:['Lijadoras, sierras, aire comprimido y algunas máquinas hacen mucho ruido. La pérdida auditiva es lenta, no duele y no tiene vuelta atrás.','Use protector auditivo donde haya un letrero obligatorio o ruido alto.','Tapón de espuma: enróllelo delgado, jale la oreja hacia arriba, introdúzcalo y sosténgalo hasta que se expanda.','Orejeras: deben cubrir toda la oreja, sin cabello, gorra o lentes que rompan el sello.']},
  q:[OQ({pt:'Quando o protetor auricular é obrigatório?',en:'When is hearing protection required?',es:'¿Cuándo es obligatorio el protector auditivo?'},
      {pt:['Só quando o barulho incomodar','Onde houver placa obrigatória ou ruído alto, como lixamento e corte','Nunca, ele atrapalha'],en:['Only when the noise bothers you','Wherever there is a mandatory sign or loud noise, like sanding and cutting','Never, it gets in the way'],es:['Solo cuando el ruido moleste','Donde haya letrero obligatorio o ruido alto, como lijado y corte','Nunca, estorba']},1,
      {pt:'O ouvido se acostuma ao barulho, mas o dano continua. Siga as placas.',en:'Your ears get used to the noise, but the damage continues. Follow the signs.',es:'El oído se acostumbra al ruido, pero el daño sigue. Siga los letreros.'}),
     OQ({pt:'Qual é o jeito certo de colocar o protetor de espuma?',en:'What is the right way to insert foam earplugs?',es:'¿Cuál es la forma correcta de poner el tapón de espuma?'},
      {pt:['Enrolar fino, colocar e segurar até expandir','Deixar só na entrada do ouvido','Cortar ao meio'],en:['Roll it thin, insert it and hold until it expands','Leave it at the entrance of the ear','Cut it in half'],es:['Enrollarlo delgado, ponerlo y sostenerlo hasta que se expanda','Dejarlo en la entrada del oído','Cortarlo a la mitad']},0,
      {pt:'Ele só protege quando expande dentro do canal do ouvido.',en:'It only protects when it expands inside the ear canal.',es:'Solo protege cuando se expande dentro del oído.'})]},
 {ico:'🏗️',t:{pt:'Máquinas e equipamentos',en:'Machines and equipment',es:'Máquinas y equipos'},
  pts:{pt:['Empilhadeira (forklift), ponte rolante (crane) e plataforma tesoura (scissor lift): só opera quem tem treinamento e autorização da empresa.','Nunca fique nem passe embaixo de uma carga suspensa. Respeite a área isolada.','Perto de empilhadeira: use a faixa de pedestres e faça contato visual com o operador antes de passar.','Manutenção ou limpeza dentro de máquina: só com a energia desligada e bloqueada com cadeado e etiqueta (lockout/tagout). Nunca remova a etiqueta de outra pessoa.'],
   en:['Forklift, overhead crane and scissor lift: only people who are trained and authorized by the company may operate them.','Never stand or walk under a suspended load. Respect barricaded areas.','Near forklifts: use the walkway and make eye contact with the operator before you pass.','Maintenance or cleaning inside a machine: only with the energy shut off and locked out with a lock and tag (lockout/tagout). Never remove someone else’s tag.'],
   es:['Montacargas (forklift), puente grúa (crane) y plataforma de tijera (scissor lift): solo los opera quien tiene entrenamiento y autorización de la empresa.','Nunca se pare ni pase debajo de una carga suspendida. Respete el área aislada.','Cerca de un montacargas: use el paso peatonal y haga contacto visual con el operador antes de pasar.','Mantenimiento o limpieza dentro de una máquina: solo con la energía apagada y bloqueada con candado y etiqueta (lockout/tagout). Nunca quite la etiqueta de otra persona.']},
  q:[OQ({pt:'A ponte rolante está levantando uma peça. O que é proibido?',en:'The overhead crane is lifting a part. What is forbidden?',es:'El puente grúa está levantando una pieza. ¿Qué está prohibido?'},
      {pt:['Ficar ou passar embaixo da carga','Respeitar a área isolada','Seguir os sinais do operador'],en:['Standing or walking under the load','Respecting the barricaded area','Following the operator signals'],es:['Pararse o pasar debajo de la carga','Respetar el área aislada','Seguir las señales del operador']},0,
      {pt:'Se a carga cair, quem está embaixo não tem tempo de sair.',en:'If the load falls, whoever is underneath has no time to get away.',es:'Si la carga cae, quien está debajo no tiene tiempo de salir.'}),
     OQ({pt:'Antes de limpar ou consertar dentro de uma máquina, o que é obrigatório?',en:'Before cleaning or fixing something inside a machine, what is required?',es:'Antes de limpiar o reparar dentro de una máquina, ¿qué es obligatorio?'},
      {pt:['Só apertar o botão de parada','Desligar e bloquear a energia com cadeado e etiqueta','Pedir para um colega vigiar o botão'],en:['Just press the stop button','Shut off and lock out the energy with a lock and tag','Ask a coworker to watch the button'],es:['Solo apretar el botón de paro','Apagar y bloquear la energía con candado y etiqueta','Pedir a un compañero que vigile el botón']},1,
      {pt:'O bloqueio garante que ninguém ligue a máquina enquanto você está dentro dela.',en:'Lockout makes sure nobody turns the machine on while you are inside it.',es:'El bloqueo asegura que nadie encienda la máquina mientras usted está dentro.'})]},
 {ico:'🚨',t:{pt:'Emergências',en:'Emergencies',es:'Emergencias'},
  pts:{pt:['Conheça o som do alarme, as rotas de fuga e o ponto de encontro da sua área. Seu líder vai mostrar no primeiro dia.','No alarme: pare o trabalho com segurança, saia pela rota indicada, sem correr, e vá ao ponto de encontro para a contagem.','Saiba onde ficam o extintor, o lava-olhos, o chuveiro de emergência e o kit de primeiros socorros.','Químico no olho: lave no lava-olhos por pelo menos 15 minutos e avise o líder. Respingo na pele: tire a roupa contaminada e lave com água.'],
   en:['Learn the alarm sound, the escape routes and the meeting point for your area. Your lead will show you on your first day.','When the alarm sounds: stop work safely, leave by the marked route without running, and go to the meeting point for the head count.','Know where the fire extinguisher, eyewash, emergency shower and first aid kit are.','Chemical in the eye: rinse at the eyewash for at least 15 minutes and tell your lead. Splash on the skin: remove contaminated clothing and wash with water.'],
   es:['Conozca el sonido de la alarma, las rutas de evacuación y el punto de reunión de su área. Su líder se lo mostrará el primer día.','Cuando suene la alarma: detenga el trabajo con seguridad, salga por la ruta indicada sin correr y vaya al punto de reunión para el conteo.','Sepa dónde están el extintor, el lavaojos, la ducha de emergencia y el botiquín.','Químico en el ojo: lávese en el lavaojos por al menos 15 minutos y avise al líder. Salpicadura en la piel: quítese la ropa contaminada y lave con agua.']},
  q:[OQ({pt:'O alarme de emergência tocou. O que fazer?',en:'The emergency alarm goes off. What do you do?',es:'Suena la alarma de emergencia. ¿Qué hace?'},
      {pt:['Terminar a peça primeiro','Parar com segurança, sair pela rota e ir ao ponto de encontro','Esconder-se no banheiro'],en:['Finish the part first','Stop safely, leave by the route and go to the meeting point','Hide in the restroom'],es:['Terminar la pieza primero','Parar con seguridad, salir por la ruta e ir al punto de reunión','Esconderse en el baño']},1,
      {pt:'No ponto de encontro é feita a contagem, para saber se todos saíram.',en:'The head count happens at the meeting point, to know that everyone got out.',es:'En el punto de reunión se hace el conteo, para saber si todos salieron.'}),
     OQ({pt:'Respingou resina no seu olho. O que fazer primeiro?',en:'Resin splashed into your eye. What do you do first?',es:'Le salpicó resina en el ojo. ¿Qué hace primero?'},
      {pt:['Esfregar o olho','Lavar no lava-olhos por pelo menos 15 minutos e avisar o líder','Pingar colírio e continuar'],en:['Rub your eye','Rinse at the eyewash for at least 15 minutes and tell your lead','Use eye drops and keep working'],es:['Frotarse el ojo','Lavarse en el lavaojos por al menos 15 minutos y avisar al líder','Echarse gotas y seguir']},1,
      {pt:'Lavar rápido e por bastante tempo diminui o dano ao olho.',en:'Rinsing quickly and for a long time reduces eye damage.',es:'Lavar rápido y por bastante tiempo reduce el daño al ojo.'})]},
 {ico:'🗣️',t:{pt:'Seus direitos e como relatar',en:'Your rights and how to report',es:'Sus derechos y cómo reportar'},
  pts:{pt:['Todo acidente, quase-acidente ou mal-estar ligado ao trabalho deve ser avisado ao seu líder o quanto antes, mesmo que pareça pequeno.','Você tem o direito de relatar lesões e doenças do trabalho e de levantar preocupações de segurança sem sofrer retaliação. Isso é lei (OSHA).','Viu um risco, como um vazamento, uma proteção faltando ou um piso escorregadio? Avise o líder ou a equipe de segurança.','Se não tiver certeza de como fazer algo com segurança, pare e pergunte. Ninguém deve trabalhar com risco.'],
   en:['Every accident, near miss or work-related illness must be reported to your lead as soon as possible, even if it seems small.','You have the right to report work-related injuries and illnesses and to raise safety concerns without retaliation. This is the law (OSHA).','Did you see a hazard, like a leak, a missing guard or a slippery floor? Tell your lead or the safety team.','If you are not sure how to do something safely, stop and ask. Nobody should work at risk.'],
   es:['Todo accidente, casi accidente o malestar relacionado con el trabajo se debe avisar a su líder lo antes posible, aunque parezca pequeño.','Usted tiene derecho a reportar lesiones y enfermedades del trabajo y a plantear inquietudes de seguridad sin represalias. Es la ley (OSHA).','¿Vio un riesgo, como una fuga, una guarda faltante o un piso resbaloso? Avise a su líder o al equipo de seguridad.','Si no está seguro de cómo hacer algo con seguridad, pare y pregunte. Nadie debe trabajar en riesgo.']},
  q:[OQ({pt:'Você se machucou de leve no trabalho. O que fazer?',en:'You got slightly hurt at work. What do you do?',es:'Se lastimó un poco en el trabajo. ¿Qué hace?'},
      {pt:['Não falar nada para não atrapalhar','Avisar o líder o quanto antes','Esperar uma semana para ver se melhora'],en:['Say nothing so you do not cause trouble','Tell your lead as soon as possible','Wait a week to see if it gets better'],es:['No decir nada para no molestar','Avisar al líder lo antes posible','Esperar una semana a ver si mejora']},1,
      {pt:'Avisar logo garante atendimento e ajuda a evitar que aconteça de novo.',en:'Reporting right away gets you care and helps keep it from happening again.',es:'Avisar enseguida le garantiza atención y ayuda a que no vuelva a pasar.'}),
     OQ({pt:'Alguém pode ser punido só por relatar um acidente ou um risco?',en:'Can someone be punished just for reporting an accident or a hazard?',es:'¿Se puede castigar a alguien solo por reportar un accidente o un riesgo?'},
      {pt:['Sim, se atrasar a produção','Não, a lei protege quem relata','Depende do líder'],en:['Yes, if it slows down production','No, the law protects people who report','It depends on the lead'],es:['Sí, si retrasa la producción','No, la ley protege a quien reporta','Depende del líder']},1,
      {pt:'A lei americana proíbe retaliação contra quem relata lesões, doenças ou riscos.',en:'U.S. law forbids retaliation against people who report injuries, illnesses or hazards.',es:'La ley de EE. UU. prohíbe las represalias contra quien reporta lesiones, enfermedades o riesgos.'})]}
];

let lang='pt',I=-1,stage='learn',Q=0,pick=null,ord=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app');
const flags=()=>`<div class="flags">${[['pt','🇧🇷 PT'],['en','🇺🇸 EN'],['es','🇪🇸 ES']].map(([k,l])=>`<button class="${lang===k?'on':''}" onclick="lang='${k}';R()">${l}</button>`).join('')}</div>`;
function speak(){try{const m=ONB[I];const u=new SpeechSynthesisUtterance(m.t[lang]+'. '+m.pts[lang].join(' '));u.lang={pt:'pt-BR',en:'en-US',es:'es-US'}[lang];speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function R(){
 const L=ONBL[lang];window.scrollTo(0,0);
 if(I<0){app.innerHTML=flags()+`<div style="border-radius:22px;overflow:hidden;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.45)"><img src="${ONB_COVER}" style="display:block;width:100%" onclick="go(0)"><button onclick="go(0)" aria-label="Start" style="position:absolute;left:18%;right:18%;bottom:8.5%;height:9%;background:transparent;border:0;cursor:pointer"></button></div><button class="btn" style="width:100%;margin-top:14px" onclick="go(0)">✈️ ${L.start} →</button>`;return}
 if(I>=ONB.length){app.innerHTML=flags()+`<div class="glass card" style="text-align:center"><div style="font-size:60px">🛫</div><h2 style="font-size:30px;margin-top:8px">${L.endT}</h2><p class="muted" style="margin-top:10px;font-size:17px">${L.endS}</p><p class="muted" style="margin-top:12px;font-size:13px">ℹ️ ${L.note}</p><button class="btn" style="margin-top:22px" onclick="I=-1;R()">↺ ${L.start}</button></div>`;return}
 const m=ONB[I],n=ONB.length;
 const top=`<div class="glass top"><b>Onboard</b><div class="prog"><i style="width:${(I+(stage==='q'?.5+Q*.25:0))/n*100}%"></i></div><span class="muted">${I+1}/${n}</span></div>`;
 const back=`<button class="btn ghost" style="margin-top:12px" onclick="back()">← ${{pt:'Voltar',en:'Back',es:'Volver'}[lang]}</button>`;
 if(stage==='learn'){app.innerHTML=flags()+top+`<div class="glass card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">${L.mod} ${I+1} ${L.of} ${n}</span><button class="btn ghost" style="padding:8px 14px;font-size:14px" onclick="speak()">🔊 ${L.listen}</button></div>
  <h2 style="font-size:25px;margin:10px 0 8px">${m.ico} ${m.t[lang]}</h2><ul style="margin-left:20px;font-size:17px;line-height:1.55">${m.pts[lang].map(p=>`<li>${p}</li>`).join('')}</ul>
  ${I===n-1?`<p class="muted" style="margin-top:14px;font-size:13px">ℹ️ ${L.note}</p>`:''}<div style="text-align:right;margin-top:16px"><button class="btn" onclick="stage='q';Q=0;pick=null;ord=null;R()">${L.learn} →</button></div></div>`+back;return}
 const q=m.q[Q];if(!ord)ord=shuffle(q.o[lang].map((_,i)=>i));
 const ok=pick===q.ans,last=Q===m.q.length-1;
 const fb=pick===null?'':`<div class="fb" style="border:1px solid ${ok?'#22c55e':'#ef4444'};background:${ok?'rgba(34,197,94,.12)':'rgba(239,68,68,.12)'}"><b style="color:${ok?'#86efac':'#fca5a5'}">${ok?'✓ '+L.right:'✗ '+L.wrong}</b> ${q.why[lang]}</div>`;
 const btn=pick===null?'':ok?`<button class="btn" onclick="next()">${last?(I===n-1?L.endB:L.nextMod):L.next} →</button>`:`<button class="btn" onclick="pick=null;ord=null;R()">↺ ${L.again}</button>`;
 app.innerHTML=flags()+top+`<div class="glass card"><span class="muted">${m.ico} ${m.t[lang]} · ${L.q} ${Q+1}/${m.q.length}</span><h3 style="font-size:21px;margin:10px 0 4px">${q.t[lang]}</h3>
  ${ord.map((oi,k)=>`<button class="glass opt" ${pick!==null?'disabled':''} style="${pick!==null&&oi===q.ans&&ok?'border-color:#22c55e;background:rgba(34,197,94,.18)':''}${pick===oi&&!ok?'border-color:#ef4444;background:rgba(239,68,68,.18)':''}" onclick="ans(${oi})"><span class="letter">${'ABC'[k]}</span><span>${q.o[lang][oi]}</span></button>`).join('')}
  ${fb}<div style="text-align:right;margin-top:14px">${btn}</div></div>`+back;
}
function go(i){I=i;stage='learn';Q=0;R()}
